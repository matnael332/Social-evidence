name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Exact versions from the lockfile; install scripts are disabled in .npmrc.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No network code, no remote address, permissions and CSP as agreed.
      - run: npm run check:build

      # What ships must have no known vulnerability.
      - run: npm audit --omit=dev

      # Development tools are reported but do not fail the build.
      - run: npm audit || true
