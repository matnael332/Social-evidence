name: Release

# Builds the extension on GitHub and publishes it as a GitHub Release, so
# people can install it without building it themselves.
#
# Two ways to start it:
#   - Actions tab > Release > Run workflow, on main, with the version to
#     publish. The release and its tag are created from that commit.
#   - Pushing a tag such as v0.3.0.
#
# Either way the version must equal the one in the manifest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, as written in the manifest (for example 0.3.0)
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - name: Releases are published from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow on main, not on $GITHUB_REF" >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The same checks as CI: a release is never built from code that fails them.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:build
      - run: npm audit --omit=dev

      - name: Check that the requested version is the one in the manifest
        run: |
          version=$(node -p "require('./dist/manifest.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Requested $TAG, but the manifest says version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The files sit at the root of the archive, so the extracted folder is
      # the one to select in "Load unpacked".
      - name: Package
        run: |
          (cd dist && zip -r -X "../social-evidence-$VERSION.zip" .)
          sha256sum "social-evidence-$VERSION.zip" > "social-evidence-$VERSION.zip.sha256"
          cat "social-evidence-$VERSION.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "social-evidence-$VERSION.zip" \
            "social-evidence-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Social Evidence $VERSION" \
            --notes-file .github/release-notes.md
